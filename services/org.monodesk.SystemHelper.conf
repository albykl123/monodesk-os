<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Policy configuration for MONODESK OS privileged helper service -->
  <policy user="root">
    <allow own="org.monodesk.SystemHelper"/>
    <allow send_destination="org.monodesk.SystemHelper"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.monodesk.SystemHelper"
           send_interface="org.monodesk.SystemHelper"
           send_member="GetSystemProfile"/>
    <allow send_destination="org.monodesk.SystemHelper"
           send_interface="org.monodesk.SystemHelper"
           send_member="GetHardwareDiagnostics"/>
  </policy>
</busconfig>
