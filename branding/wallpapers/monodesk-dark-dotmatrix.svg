<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="60%" stop-color="#0E0E0E" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    
    <!-- Dot-matrix grid pattern -->
    <pattern id="dotPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#242424" />
    </pattern>
  </defs>

  <!-- Deep Matte Dark Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />
  
  <!-- Subtle Industrial Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#dotPattern)" opacity="0.85" />
  
  <!-- Center Watermark Element -->
  <g transform="translate(1920, 1080)" opacity="0.12">
    <!-- Concentric Dot-Matrix Rings -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4, 20" />
    <circle cx="0" cy="0" r="420" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2, 28" />
    <circle cx="0" cy="0" r="560" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2, 36" />
    
    <!-- Center Emblem -->
    <text x="0" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="24">MONODESK</text>
    <text x="0" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="400" fill="#AAAAAA" letter-spacing="18">UNIVERSAL PC EDITION</text>
  </g>
</svg>
