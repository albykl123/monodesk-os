---
# MONODESK OS — Post-Install Security Cleanup (removes live-only credentials & autologin)
dontChroot: false
timeout: 30
script:
  - "rm -rf /etc/systemd/system/getty@tty1.service.d /etc/systemd/system/serial-getty@ttyS0.service.d"
  - "rm -f /etc/systemd/system/*/autologin.conf"
  - "rm -f /etc/sudoers.d/99-monodesk-live /etc/sudoers.d/live"
  - "rm -f /etc/lightdm/lightdm.conf.d/01-monodesk-autologin.conf /etc/lightdm/lightdm.conf.d/*live*"
  - "rm -rf /etc/live/config.conf.d"
  - "rm -f /etc/xdg/autostart/calamares-desktop-icon.desktop"
  - "mkdir -p /etc/lightdm/lightdm.conf.d"
  - "printf '[Seat:*]\\ngreeter-session=lightdm-gtk-greeter\\nuser-session=xfce\\nallow-guest=false\\n' > /etc/lightdm/lightdm.conf.d/01-monodesk-greeter.conf"
  - "passwd -l root || true"
