# ==============================================================================
# MONODESK OS 2.0 — Hyprlock Configuration
# Dot-matrix clock, high-contrast monochrome password prompt.
# ==============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/monodesk/monodesk-dark-dotmatrix.svg
    color = rgba(18, 18, 18, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.8)
    inner_color = rgba(24, 24, 24, 0.9)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Enter Password...</span>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = MONODESK OS 2.0
    color = rgba(180, 180, 180, 0.8)
    font_size = 14
    font_family = Inter
    position = 0, 30
    halign = center
    valign = center
}
