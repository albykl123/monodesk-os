# MONODESK OS — Operating System Privacy Specification
# 100% Zero-Telemetry Policy

[Privacy]
TelemetryEnabled=false
CrashReporting=local_only
AnalyticsCollection=disabled
LocationServices=manual_only
OnlineAccountsMandatory=false
RemoteDiagnostics=disabled
DiagnosticRedaction=true

# Privacy Rules:
# 1. No background metrics are ever transmitted to external servers.
# 2. Hardware diagnostic reports redact all MAC addresses, UUIDs, and serial numbers.
# 3. APT package operations use official signed Debian repositories directly.
